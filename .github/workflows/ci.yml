# CI: typecheck + hermetic test suite (vitest, zero network).
# NOTE: Actions are currently blocked on the source GitHub account — this
# workflow is included so it runs as soon as the repo is published.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Bun installs from the lockfile; Node proves runtime portability
        # (>= 22.18 strips TS types natively — no build step).
        runtime: [bun, node]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Set up Node
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install (bun, frozen lockfile)
        if: matrix.runtime == 'bun'
        run: bun install --frozen-lockfile

      - name: Install (node)
        if: matrix.runtime == 'node'
        run: npm install --no-audit --no-fund

      - name: Typecheck (tsc --noEmit)
        run: node_modules/.bin/tsc --noEmit

      - name: Test (vitest, hermetic)
        run: node_modules/.bin/vitest run
